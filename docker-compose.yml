version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: emeta_admin
      POSTGRES_PASSWORD: "${CORTEX_POSTGRES_PASSWORD:?Set CORTEX_POSTGRES_PASSWORD in the deployment environment}"
      POSTGRES_DB: cortex_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cortex_net

volumes:
  postgres_data:

networks:
  cortex_net:
    name: cortex_net