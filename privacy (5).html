<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="privacy.meta.title">
    Politique de confidentialité — e-META
  </title>

  <!-- CSS global -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled />

  <!-- JS i18n -->
  <script src="i18n.js"></script>
  <script src="script.js" defer></script>

  <!-- Style local (inchangé) -->
  <style>
    :root {
      --bg-card: rgba(255,255,255,0.04);
      --border-soft: rgba(255,255,255,0.08);
      --text-muted: rgba(255,255,255,0.75);
      --accent: #ff8a00;
      --radius: 18px;
      --max-width: 960px;
    }

    main { padding: 48px 16px 80px; }

    .privacy-container {
      max-width: var(--max-width);
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 36px 32px;
    }

    .privacy-header {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 { margin: 0; font-size: 1.6rem; }
    h2 { margin-top: 28px; font-size: 1.15rem; }

    p, li {
      font-size: .95rem;
      line-height: 1.65;
      color: var(--text-muted);
    }

    ul { padding-left: 18px; }

    .pdf-box {
      margin-top: 32px;
      padding: 20px;
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px dashed var(--border-soft);
      text-align: center;
    }

    .pdf-box a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: .9rem;
    }

    footer {
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid var(--border-soft);
      text-align: center;
      font-size: .85rem;
      color: var(--text-muted);
    }

    @media(max-width:600px){
      .privacy-container{padding:24px 18px}
      h1{font-size:1.4rem}
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="logo"><span class="logo-mark">e</span>META</div>
    <a class="back-home" href="index.html" data-i18n="privacy.back">
      ← Retour à l’accueil
    </a>
  </div>
</header>

<main>
  <section class="privacy-container">

    <div class="privacy-header">
      <div style="font-size:1.8rem">🔐</div>
      <h1 data-i18n="privacy.title"></h1>
    </div>

    <p data-i18n="privacy.intro"></p>

    <h2 data-i18n="privacy.section1.title"></h2>
    <p data-i18n="privacy.section1.text"></p>

    <h2 data-i18n="privacy.section2.title"></h2>
    <ul>
      <li data-i18n="privacy.section2.item1"></li>
      <li data-i18n="privacy.section2.item2"></li>
      <li data-i18n="privacy.section2.item3"></li>
    </ul>

    <h2 data-i18n="privacy.section3.title"></h2>
    <ul>
      <li data-i18n="privacy.section3.item1"></li>
      <li data-i18n="privacy.section3.item2"></li>
      <li data-i18n="privacy.section3.item3"></li>
    </ul>

    <h2 data-i18n="privacy.section4.title"></h2>
    <p data-i18n="privacy.section4.text"></p>

    <h2 data-i18n="privacy.section5.title"></h2>
    <p data-i18n="privacy.section5.text"></p>

    <div class="pdf-box">
      <p><strong data-i18n="privacy.pdf.title"></strong></p>
      <p data-i18n="privacy.pdf.desc"></p>
      <a id="pdfPrivacyLink" target="_blank" data-i18n="privacy.download"></a>
    </div>

    <footer>
      <span data-i18n="footer.copy"></span>
    </footer>

  </section>
</main>

</body>
</html>
