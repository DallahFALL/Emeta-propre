<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title data-i18n="privacy.meta.title"></title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled />

  <style>
    .privacy-wrapper {
      max-width: 820px;
      margin: 64px auto 80px;
      padding: 32px 24px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
    }

    .privacy-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .privacy-header h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .privacy-wrapper h2 {
      margin-top: 24px;
      margin-bottom: 8px;
      font-size: 1.05rem;
      color: #ff8a00;
    }

    .privacy-wrapper p,
    .privacy-wrapper li {
      font-size: 0.92rem;
      line-height: 1.6;
      opacity: 0.85;
    }

    .privacy-wrapper ul {
      padding-left: 18px;
    }

    .privacy-download {
      margin-top: 32px;
      padding-top: 18px;
      border-top: 1px dashed rgba(255,255,255,0.15);
      text-align: center;
    }

    .privacy-download a {
      font-size: 0.85rem;
      opacity: 0.7;
      text-decoration: underline;
    }

    .privacy-back {
      display: block;
      margin-top: 28px;
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.6;
    }

    @media (max-width: 640px) {
      .privacy-wrapper {
        margin: 32px 12px 64px;
        padding: 24px 16px;
      }

      .privacy-header h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
    </a>
  </div>
</header>

<main>
  <section class="privacy-wrapper">

    <div class="privacy-header">
      <span>🔐</span>
      <h1 data-i18n="privacy.title"></h1>
    </div>

    <p data-i18n="privacy.intro"></p>

    <h2 data-i18n="privacy.section1.title"></h2>
    <p data-i18n="privacy.section1.text"></p>

    <h2 data-i18n="privacy.section2.title"></h2>
    <ul>
      <li data-i18n="privacy.section2.item1"></li>
      <li data-i18n="privacy.section2.item2"></li>
      <li data-i18n="privacy.section2.item3"></li>
    </ul>

    <h2 data-i18n="privacy.section3.title"></h2>
    <ul>
      <li data-i18n="privacy.section3.item1"></li>
      <li data-i18n="privacy.section3.item2"></li>
      <li data-i18n="privacy.section3.item3"></li>
    </ul>

    <h2 data-i18n="privacy.section4.title"></h2>
    <p data-i18n="privacy.section4.text"></p>

    <h2 data-i18n="privacy.section5.title"></h2>
    <p data-i18n="privacy.section5.text"></p>

    <div class="privacy-download">
      <a
        href="docs/privacy-e-meta.pdf"
        download
        data-i18n="privacy.download"
      ></a>
    </div>

    <a href="index.html" class="privacy-back" data-i18n="privacy.back"></a>

  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-copy" data-i18n="footer.copy"></p>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="script.js"></script>

</body>
</html>
