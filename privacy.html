<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title data-i18n="privacy.meta.title"></title>

  <!-- Styles globaux e-META -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled />

  <!-- Styles locaux (ISOLÉS à la page privacy) -->
  <style>
    .privacy-wrapper {
      max-width: 920px;
      margin: 48px auto 80px;
      padding: 32px 28px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
    }

    .privacy-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .privacy-header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .privacy-wrapper h2 {
      margin-top: 28px;
      margin-bottom: 10px;
      font-size: 1.15rem;
      color: #ff8a00;
    }

    .privacy-wrapper p,
    .privacy-wrapper li {
      font-size: 0.95rem;
      line-height: 1.65;
      opacity: 0.85;
    }

    .privacy-wrapper ul {
      padding-left: 18px;
    }

    .privacy-pdf {
      margin-top: 36px;
      padding: 22px;
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(255,255,255,0.15);
      text-align: center;
    }

    .privacy-pdf a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg,#ff7a18,#ff9f1c);
      color: #000;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .privacy-back {
      display: inline-block;
      margin-top: 28px;
      font-size: 0.9rem;
      opacity: 0.75;
    }

    @media (max-width: 640px) {
      .privacy-wrapper {
        padding: 24px 18px;
      }
      .privacy-header h1 {
        font-size: 1.35rem;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
    </a>
  </div>
</header>

<main>
  <section class="privacy-wrapper">

    <div class="privacy-header">
      <div style="font-size:1.8rem">🔐</div>
      <h1 data-i18n="privacy.title"></h1>
    </div>

    <p data-i18n="privacy.intro"></p>

    <h2 data-i18n="privacy.section1.title"></h2>
    <p data-i18n="privacy.section1.text"></p>

    <h2 data-i18n="privacy.section2.title"></h2>
    <ul>
      <li data-i18n="privacy.section2.item1"></li>
      <li data-i18n="privacy.section2.item2"></li>
      <li data-i18n="privacy.section2.item3"></li>
    </ul>

    <h2 data-i18n="privacy.section3.title"></h2>
    <ul>
      <li data-i18n="privacy.section3.item1"></li>
      <li data-i18n="privacy.section3.item2"></li>
      <li data-i18n="privacy.section3.item3"></li>
    </ul>

    <h2 data-i18n="privacy.section4.title"></h2>
    <p data-i18n="privacy.section4.text"></p>

    <h2 data-i18n="privacy.section5.title"></h2>
    <p data-i18n="privacy.section5.text"></p>

    <div class="privacy-pdf">
      <p><strong data-i18n="privacy.pdf.title"></strong></p>
      <p data-i18n="privacy.pdf.text"></p>

      <a
        href="docs/privacy-e-meta.pdf"
        download
        data-i18n="privacy.download"
      ></a>
    </div>

    <a href="index.html" class="privacy-back" data-i18n="privacy.back"></a>

  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-copy" data-i18n="footer.copy"></p>
  </div>
</footer>

<!-- i18n engine -->
<script src="i18n.js"></script>
<script src="script.js"></script>

</body>
</html>
