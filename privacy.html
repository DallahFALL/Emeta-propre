<!DOCTYPE html>
<html dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="privacy.title"></title>

  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="site-header">
  <div class="container header-inner">

    <a href="index.html" class="logo" aria-label="e-META">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
      <span class="logo-tagline" data-i18n="tagline"></span>
    </a>

    <div class="header-actions">
      <select id="languageSwitcher" class="lang-select" aria-label="Language selector">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ar">ع</option>
      </select>
    </div>

  </div>
</header>

<main class="container" style="padding: 3rem 0;">

  <section class="legal-page" style="max-width: 960px; margin: 0 auto;">

    <h1 data-i18n="privacy.title" style="margin-bottom: 1rem;"></h1>

    <p class="hero-subtitle" data-i18n="privacy.intro" style="margin-bottom: 2rem;"></p>

    <div class="legal-content"
         style="line-height: 1.8; font-size: 1rem; color: rgba(255,255,255,.9);">

      <p data-i18n="privacy.content"></p>

    </div>

    <div style="margin-top: 2.5rem;">
      <a href="index.html" class="btn-secondary" data-i18n="privacy.back"></a>
    </div>

  </section>

</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-copy" data-i18n="footer.text"></p>
    <a href="privacy.html" class="footer-link" data-i18n="footer.privacy"></a>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
