<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="privacy.meta.title">Politique de confidentialité — e-META</title>

  <!-- STYLE (cohérent avec index.html) -->
  <style>
    :root {
      --bg-main: #070b1a;
      --bg-card: rgba(255,255,255,0.04);
      --border-soft: rgba(255,255,255,0.08);
      --text-main: #ffffff;
      --text-muted: rgba(255,255,255,0.75);
      --accent: #ff8a00;
      --radius: 18px;
      --max-width: 920px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #060918, #090d22);
      color: var(--text-main);
    }

    a { color: inherit; text-decoration: none; }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(6,9,24,0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-soft);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
    }

    .logo span { color: var(--accent); }

    .back-home {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* CONTENT */
    main { padding: 40px 16px 80px; }

    .privacy-container {
      max-width: var(--max-width);
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 32px 28px;
    }

    .privacy-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .icon { font-size: 1.8rem; }

    h1 { font-size: 1.6rem; margin: 0; }

    .intro {
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    h2 {
      font-size: 1.15rem;
      margin-top: 28px;
      margin-bottom: 10px;
    }

    p, li {
      color: var(--text-muted);
      line-height: 1.65;
      font-size: 0.95rem;
    }

    ul { padding-left: 18px; margin: 10px 0 0; }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border-soft);
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* RTL */
    [dir="rtl"] {
      direction: rtl;
      text-align: right;
    }

    [dir="rtl"] ul {
      padding-right: 18px;
      padding-left: 0;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .privacy-container { padding: 22px 18px; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo"><span>e</span>-META</div>
    <a class="back-home" href="index.html" data-i18n="privacy.back">← Retour à l’accueil</a>
  </div>
</header>

<main>
  <section class="privacy-container">

    <div class="privacy-header">
      <div class="icon">🔒</div>
      <h1 data-i18n="privacy.title">Politique de confidentialité — e-META</h1>
    </div>

    <p class="intro" data-i18n="privacy.intro"></p>

    <h2 data-i18n="privacy.s1.title"></h2>
    <p data-i18n="privacy.s1.text"></p>

    <h2 data-i18n="privacy.s2.title"></h2>
    <ul>
      <li data-i18n="privacy.s2.l1"></li>
      <li data-i18n="privacy.s2.l2"></li>
      <li data-i18n="privacy.s2.l3"></li>
      <li data-i18n="privacy.s2.l4"></li>
    </ul>

    <h2 data-i18n="privacy.s3.title"></h2>
    <ul>
      <li data-i18n="privacy.s3.l1"></li>
      <li data-i18n="privacy.s3.l2"></li>
      <li data-i18n="privacy.s3.l3"></li>
    </ul>

    <h2 data-i18n="privacy.s4.title"></h2>
    <p data-i18n="privacy.s4.text"></p>

    <h2 data-i18n="privacy.s5.title"></h2>
    <p data-i18n="privacy.s5.text"></p>

    <h2 data-i18n="privacy.s6.title"></h2>
    <p data-i18n="privacy.s6.text"></p>

    <h2 data-i18n="privacy.s7.title"></h2>
    <p data-i18n="privacy.s7.text"></p>

    <h2 data-i18n="privacy.s8.title"></h2>
    <p data-i18n="privacy.s8.text"></p>

    <h2 data-i18n="privacy.s9.title"></h2>
    <p data-i18n="privacy.s9.text"></p>

    <footer data-i18n="privacy.footer"></footer>

  </section>
</main>

<!-- SCRIPTS I18N (OBLIGATOIRES) -->
<script src="i18n.js"></script>
<script src="script.js"></script>

</body>
</html>
