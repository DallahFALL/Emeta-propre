<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="privacy.meta.title">Politique de confidentialité — e-META</title>

  <!-- Styles globaux -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled />
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="site-header">
  <div class="container header-inner">
    <div class="logo">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
    </div>

    <a href="index.html" class="btn-secondary small" data-i18n="privacy.back">
      ← Retour à l’accueil
    </a>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="privacy-page">
  <section class="privacy-container">

    <header class="privacy-header">
      <h1 data-i18n="privacy.title"></h1>
      <p class="privacy-intro" data-i18n="privacy.intro"></p>
    </header>

    <div class="privacy-block">
      <h2 data-i18n="privacy.s1.title"></h2>
      <p data-i18n="privacy.s1.text"></p>
    </div>

    <div class="privacy-block">
      <h2 data-i18n="privacy.s2.title"></h2>
      <ul>
        <li data-i18n="privacy.s2.li1"></li>
        <li data-i18n="privacy.s2.li2"></li>
        <li data-i18n="privacy.s2.li3"></li>
      </ul>
    </div>

    <div class="privacy-block">
      <h2 data-i18n="privacy.s3.title"></h2>
      <p data-i18n="privacy.s3.text"></p>
    </div>

    <div class="privacy-block">
      <h2 data-i18n="privacy.s4.title"></h2>
      <p data-i18n="privacy.s4.text"></p>
    </div>

    <div class="privacy-actions">
      <a
        id="privacyPdfLink"
        class="btn-primary full"
        target="_blank"
        download
        data-i18n="privacy.download">
      </a>

      <a href="index.html" class="privacy-back" data-i18n="privacy.back"></a>
    </div>

  </section>
</main>

<!-- ================= FOOTER ================= -->
<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <span class="logo-mark">e</span><span class="logo-text">META</span>
    </div>
    <p class="footer-copy" data-i18n="footer.copy">
      © 2026 e-META — Tous droits réservés
    </p>
  </div>
</footer>

<!-- ================= SCRIPTS ================= -->
<script src="i18n.js"></script>
<script src="script.js"></script>

<script>
  /* PDF dynamique selon la langue */
  const lang = localStorage.getItem("lang") || "fr";
  const pdfMap = {
    fr: "docs/privacy_fr.pdf",
    en: "docs/privacy_en.pdf",
    es: "docs/privacy_es.pdf",
    ar: "docs/privacy_ar.pdf"
  };
  const link = document.getElementById("privacyPdfLink");
  if (link && pdfMap[lang]) link.href = pdfMap[lang];
</script>

</body>
</html>
