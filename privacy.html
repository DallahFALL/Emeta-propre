<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="privacy.title"></title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">e</span><span class="logo-text">META</span>
      <span class="logo-tagline" data-i18n="tagline"></span>
    </a>

    <nav class="nav">
      <ul>
        <li><a href="index.html" data-i18n="nav.home"></a></li>
        <li><a href="index.html#form" data-i18n="nav.form"></a></li>
      </ul>
    </nav>

    <select id="languageSwitcher" class="lang-select">
      <option value="fr">FR</option>
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="ar">ع</option>
    </select>
  </div>
</header>

<section class="hero">
  <div class="container hero-inner">

    <div class="hero-text">
      <h1 data-i18n="privacy.title"></h1>
      <p class="hero-subtitle" data-i18n="privacy.intro"></p>

      <ul class="hero-points">
        <li data-i18n="privacy.p1"></li>
        <li data-i18n="privacy.p2"></li>
        <li data-i18n="privacy.p3"></li>
        <li data-i18n="privacy.p4"></li>
        <li data-i18n="privacy.note"></li>
      </ul>

      <a href="index.html" class="cta-primary" data-i18n="privacy.back"></a>
    </div>

  </div>
</section>

<footer class="site-footer">
  <div class="container footer-inner">
    <p data-i18n="footer.text"></p>
    <a href="privacy.html" data-i18n="footer.privacy"></a>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
