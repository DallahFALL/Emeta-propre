<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="privacy.meta.title">Politique de confidentialité — e-META</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
<header>
  <div class="header-inner">
    <div class="logo"><span class="logo-mark">e</span>-META</div>
    <a class="back-home" href="index.html" data-i18n="privacy.back">← Retour à l’accueil</a>
  </div>
</header>

<main>
  <section class="privacy-container">
    <div class="privacy-header">
      <div style="font-size:1.8rem">🔐</div>
      <h1 data-i18n="privacy.title">Politique de confidentialité</h1>
    </div>

    <p data-i18n="privacy.intro"></p>

    <h2 data-i18n="privacy.section1.title"></h2>
    <p data-i18n="privacy.section1.text"></p>

    <h2 data-i18n="privacy.section2.title"></h2>
    <ul>
      <li data-i18n="privacy.section2.item1"></li>
      <li data-i18n="privacy.section2.item2"></li>
      <li data-i18n="privacy.section2.item3"></li>
    </ul>

    <h2 data-i18n="privacy.section3.title"></h2>
    <ul>
      <li data-i18n="privacy.section3.item1"></li>
      <li data-i18n="privacy.section3.item2"></li>
      <li data-i18n="privacy.section3.item3"></li>
    </ul>

    <h2 data-i18n="privacy.section4.title"></h2>
    <p data-i18n="privacy.section4.text"></p>

    <h2 data-i18n="privacy.section5.title"></h2>
    <p data-i18n="privacy.section5.text"></p>

    <div class="pdf-box">
      <p><strong data-i18n="privacy.pdf.title"></strong></p>
      <p data-i18n="privacy.pdf.text"></p>
      <a id="privacyPdf" target="_blank" rel="noopener" data-i18n="privacy.download" href="docs/privacy_fr.pdf"></a>
    </div>

    <footer>
      <span data-i18n="footer.copy">© 2026 e-META — Tous droits réservés</span>
    </footer>
  </section>
</main>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const urlLang = params.get("lang");
  if (urlLang) {
    localStorage.setItem("emeta_lang", urlLang);
    document.documentElement.lang = urlLang;
    document.documentElement.dir = (urlLang === "ar") ? "rtl" : "ltr";
  }
})();
</script>

<script src="i18n.js"></script>
<script src="script.js"></script>

</body>
</html>
