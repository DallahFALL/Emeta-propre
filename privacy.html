<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="privacy.meta.title">Politique de confidentialité — e-META</title>

  <style>
    :root{
      --bg-main:#070b1a;
      --bg-card:rgba(255,255,255,.04);
      --border-soft:rgba(255,255,255,.08);
      --text-main:#fff;
      --text-muted:rgba(255,255,255,.75);
      --accent:#ff8a00;
      --radius:18px;
      --max-width:960px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,sans-serif;
      background:linear-gradient(180deg,#060918,#090d22);
      color:var(--text-main);
    }
    a{color:inherit;text-decoration:none}

    header{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(6,9,24,.9);
      backdrop-filter:blur(8px);
      border-bottom:1px solid var(--border-soft);
    }

    .header-inner{
      max-width:1200px;
      margin:0 auto;
      padding:14px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .logo{font-weight:900;font-size:1.2rem}
    .logo span{color:var(--accent)}
    .back-home{font-size:.9rem;color:var(--text-muted)}

    main{padding:48px 16px 80px}

    .privacy-container{
      max-width:var(--max-width);
      margin:0 auto;
      background:var(--bg-card);
      border:1px solid var(--border-soft);
      border-radius:var(--radius);
      padding:36px 32px;
    }

    h1{margin:0 0 20px;font-size:1.6rem}
    h2{margin-top:28px;margin-bottom:10px;font-size:1.15rem}
    p,li{font-size:.95rem;line-height:1.65;color:var(--text-muted)}
    ul{padding-left:18px}

    .pdf-box{
      margin-top:32px;
      padding:20px;
      border-radius:14px;
      background:rgba(255,255,255,.03);
      border:1px dashed var(--border-soft);
      text-align:center;
    }

    .pdf-box a{
      display:inline-block;
      margin-top:10px;
      padding:10px 18px;
      border-radius:999px;
      background:var(--accent);
      color:#000;
      font-weight:800;
      font-size:.9rem;
    }

    footer{
      margin-top:40px;
      padding-top:18px;
      border-top:1px solid var(--border-soft);
      text-align:center;
      font-size:.85rem;
      color:var(--text-muted);
    }

    @media(max-width:600px){
      .privacy-container{padding:24px 18px}
      h1{font-size:1.4rem}
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo"><span>e</span>-META</div>
    <a class="back-home" href="index.html" data-i18n="privacy.back">← Retour à l’accueil</a>
  </div>
</header>

<main>
  <section class="privacy-container">

    <h1 data-i18n="privacy.title">Politique de confidentialité — e-META</h1>

    <p data-i18n="privacy.intro"></p>

    <h2 data-i18n="privacy.s1.title"></h2>
    <p data-i18n="privacy.s1.text"></p>

    <h2 data-i18n="privacy.s2.title"></h2>
    <ul>
      <li data-i18n="privacy.s2.li1"></li>
      <li data-i18n="privacy.s2.li2"></li>
      <li data-i18n="privacy.s2.li3"></li>
    </ul>

    <h2 data-i18n="privacy.s3.title"></h2>
    <ul>
      <li data-i18n="privacy.s3.li1"></li>
      <li data-i18n="privacy.s3.li2"></li>
      <li data-i18n="privacy.s3.li3"></li>
    </ul>

    <h2 data-i18n="privacy.s4.title"></h2>
    <p data-i18n="privacy.s4.text"></p>

    <h2 data-i18n="privacy.s5.title"></h2>
    <p data-i18n="privacy.s5.text"></p>

    <div class="pdf-box">
      <p data-i18n="privacy.pdf.label"></p>
      <a href="e-META_Politique_de_confidentialite_2026.pdf" target="_blank"
         data-i18n="privacy.pdf.btn"></a>
    </div>

    <footer data-i18n="privacy.footer"></footer>

  </section>
</main>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
