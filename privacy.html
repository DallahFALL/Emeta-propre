<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title data-i18n="privacy.meta.title"></title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled />
</head>

<body class="privacy-page">

  <!-- HEADER IDENTIQUE À INDEX -->
  <header class="site-header">
    <div class="container header-inner">

      <a class="logo" href="index.html">
        <span class="logo-mark">e</span>
        <span class="logo-text">META</span>
      </a>

      <!-- ⚠️ AUCUN TEXTE EN DUR -->
      <a class="back-home" href="index.html" data-i18n="privacy.back"></a>

    </div>
  </header>

  <main>
    <section class="privacy-container container">

      <div class="privacy-header">
        <div class="privacy-icon">🔐</div>
        <h1 data-i18n="privacy.title"></h1>
      </div>

      <p data-i18n="privacy.intro"></p>

      <h2 data-i18n="privacy.section1.title"></h2>
      <p data-i18n="privacy.section1.text"></p>

      <h2 data-i18n="privacy.section2.title"></h2>
      <ul>
        <li data-i18n="privacy.section2.item1"></li>
        <li data-i18n="privacy.section2.item2"></li>
        <li data-i18n="privacy.section2.item3"></li>
      </ul>

      <h2 data-i18n="privacy.section3.title"></h2>
      <ul>
        <li data-i18n="privacy.section3.item1"></li>
        <li data-i18n="privacy.section3.item2"></li>
        <li data-i18n="privacy.section3.item3"></li>
      </ul>

      <h2 data-i18n="privacy.section4.title"></h2>
      <p data-i18n="privacy.section4.text"></p>

      <h2 data-i18n="privacy.section5.title"></h2>
      <p data-i18n="privacy.section5.text"></p>

      <div class="pdf-box">
        <p><strong data-i18n="privacy.pdf.title"></strong></p>
        <p data-i18n="privacy.pdf.text"></p>
        <a
          id="pdfPrivacyLink"
          class="btn-primary"
          target="_blank"
          rel="noopener"
          data-i18n="privacy.download">
        </a>
      </div>

      <footer class="privacy-footer">
        <span data-i18n="footer.copy"></span>
      </footer>

    </section>
  </main>

  <!-- UN SEUL MOTEUR I18N -->
  <script src="i18n.js"></script>
  <script src="script.js"></script>

</body>
</html>
