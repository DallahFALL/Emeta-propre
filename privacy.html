<!DOCTYPE html>
<html dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="privacy.title"></title>

  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="site-header">
  <div class="container header-inner">

    <a href="index.html" class="logo" aria-label="e-META">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
      <span class="logo-tagline" data-i18n="tagline"></span>
    </a>

    <button class="burger" id="burgerBtn" type="button" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="mainNav" aria-label="Main navigation">
      <ul>
        <li><a href="index.html" data-i18n="nav.home"></a></li>
        <li><a href="index.html#form" data-i18n="nav.form"></a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <select id="languageSwitcher" class="lang-select" aria-label="Language selector">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ar">ع</option>
      </select>

      <a class="header-cta" href="index.html#form" data-i18n="btn.custom"></a>
    </div>

  </div>
</header>

<main class="privacy-page">
  <section class="hero">
    <div class="container">
      <div class="hero-text" style="max-width: 900px; margin: 0 auto;">

        <h1 data-i18n="privacy.title"></h1>

        <p class="hero-subtitle" data-i18n="privacy.intro"></p>

        <p data-i18n="privacy.content" style="color: rgba(255,255,255,.86); line-height: 1.7;"></p>

        <a class="privacy-back" href="index.html" data-i18n="privacy.back"></a>

      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-copy" data-i18n="footer.text"></p>
    <a href="privacy.html" class="footer-link" data-i18n="footer.privacy"></a>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
