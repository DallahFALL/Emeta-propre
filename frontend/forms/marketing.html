<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pack Marketing</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
  <div class="container">
    <a href="../index.html">← Retour</a>
    <h1>Pack Marketing</h1>
    <form id="packForm">
      <label>Nom du projet<input name="projectName" required></label>
      <label>Objectif principal<select name="objective"><option value="awareness">Notoriété</option><option value="conversion">Conversion</option></select></label>
      <label>Budget prévisionnel (USD)<input type="number" name="budget"></label>
      <label>Canaux envisagés<textarea name="channels"></textarea></label>
      <button type="submit">Envoyer</button>
    </form>
    <pre id="result"></pre>
  </div>

  <script>
  const form = document.getElementById('packForm'), out=document.getElementById('result');
  function getLang(){
    const q = new URLSearchParams(window.location.search).get('lang');
    return q || localStorage.getItem('siteLang') || 'fr';
  }
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(form));
    const payload = {pack:'marketing', lang:getLang(), payload:fd};
    out.textContent = 'Envoi...';
    try{
      const res = await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const body = await res.json();
      out.textContent = JSON.stringify(body, null, 2);
    }catch(err){ out.textContent = 'Erreur: '+err.message; }
  });
  </script>
</body>
</html>
