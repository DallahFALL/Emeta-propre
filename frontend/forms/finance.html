<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finance — e-META</title>
  <style>body{font-family:Inter,Arial;max-width:980px;margin:24px auto;padding:0 18px;color:#222}label{display:block;margin:10px 0 6px}input,textarea{width:100%;padding:10px;border-radius:6px;border:1px solid #ddd}button{margin-top:12px;background:#075fa8;color:#fff;padding:10px 14px;border-radius:8px;border:none}</style>
</head>
<body>
  <h1>Pack Financement</h1>
  <form id="form">
    <label>Nom / Entreprise</label><input name="company" required/>
    <label>Montant recherché</label><input name="amount" placeholder="Ex: 50 000" />
    <label>Usage des fonds</label><textarea name="usage" rows="4"></textarea>
    <label>Annexes / commentaires</label><textarea name="notes" rows="3"></textarea>
    <button type="submit">Envoyer</button>
  </form>
  <pre id="result"></pre>
  <script>
    const f = document.getElementById('form'), res=document.getElementById('result');
    function lang(){return localStorage.getItem('e_meta_lang') || 'fr'}
    f.addEventListener('submit', async e=>{
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(f));
      const body = {pack:'finance', lang:lang(), payload};
      res.textContent='Envoi...';
      try{
        const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const j=await r.json();
        if(!r.ok) throw new Error(j.error);
        res.textContent = j.output;
      }catch(err){res.textContent = 'Erreur: '+err.message}
    });
  </script>
</body>
</html>
