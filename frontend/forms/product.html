<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Produit — e-META</title>
<style>body{font-family:Inter,Arial;max-width:980px;margin:24px auto;padding:0 18px;color:#222}label{display:block;margin:10px 0 6px}input,textarea{width:100%;padding:10px;border-radius:6px;border:1px solid #ddd}button{margin-top:12px;background:#075fa8;color:#fff;padding:10px 14px;border-radius:8px;border:none}</style>
</head>
<body>
  <h1>Pack Produit</h1>
  <form id="form">
    <label>Nom produit</label><input name="productName" required />
    <label>Problème client</label><textarea name="problem" rows="3" required></textarea>
    <label>Proposition de valeur</label><textarea name="value" rows="3"></textarea>
    <label>Go-to-market</label><textarea name="gtm" rows="2"></textarea>
    <button type="submit">Envoyer</button>
  </form>
  <pre id="result"></pre>
  <script>
    const f=document.getElementById('form'), r=document.getElementById('result');
    function lang(){return localStorage.getItem('e_meta_lang')||'fr'}
    f.addEventListener('submit', async e=>{
      e.preventDefault();
      r.textContent='Envoi...';
      try{
        const res = await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pack:'product',lang:lang(),payload:Object.fromEntries(new FormData(f))})});
        const j = await res.json();
        if(!res.ok) throw new Error(j.error || JSON.stringify(j));
        r.textContent = j.output;
      }catch(err){r.textContent='Erreur: '+err.message}
    });
  </script>
</body>
</html>
