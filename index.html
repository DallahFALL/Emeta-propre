<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="meta.title">e-META — Assistant IA</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled />

  <script defer src="i18n.js"></script>
  <script defer src="js/ui-engine.js"></script>
  <script defer src="js/app.js"></script>
</head>

<body id="top">
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="logo" href="#/" aria-label="e-META">
        <span class="logo-mark">e</span>
        <span class="logo-text">META</span>
        <span class="logo-tagline" data-i18n="header.tagline">Assistant IA multilingue de prise de décision</span>
      </a>

      <nav class="nav" aria-label="Primary">
        <a class="nav-link" href="#/form" data-i18n="nav.form">Formulaire</a>
        <a class="nav-link" href="#/privacy" data-i18n="nav.privacy">Confidentialité</a>
      </nav>

      <div class="header-actions">
        <label class="sr-only" for="langSelect">Langue</label>
        <select id="langSelect" class="lang-select" aria-label="Language switch">
          <option value="fr">FR</option>
          <option value="en">EN</option>
          <option value="es">ES</option>
          <option value="ar">AR</option>
        </select>

        <button class="burger" id="burgerBtn" aria-label="Menu" aria-expanded="false" aria-controls="mobileMenu">
          ☰
        </button>
      </div>
    </div>

    <div id="mobileMenu" class="mobile-menu" hidden>
      <a href="#/form" data-i18n="nav.form">Formulaire</a>
      <a href="#/privacy" data-i18n="nav.privacy">Confidentialité</a>
    </div>
  </header>

  <!-- IMPORTANT: on ne change PLUS de page, on injecte ici -->
  <main id="app" class="app-root" role="main">
    <!-- view injected -->
  </main>

  <footer class="site-footer">
    <div class="container">
      <small data-i18n="footer.copy">© 2026 e-META</small>
    </div>
  </footer>
</body>
</html>
