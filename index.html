<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="meta.title">e-META</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled>
</head>
<body id="top">

<header class="site-header">
<div class="container header-inner">
<a class="logo" href="#top"><b>e</b>META <span data-i18n="header.tagline"></span></a>
<button id="burgerBtn">☰</button>
<nav id="mainNav">
<a href="#top" data-i18n="nav.home"></a>
<a href="#form" data-i18n="nav.form"></a>
<a href="privacy.html" data-i18n="nav.privacy"></a>
</nav>
<select id="langSelect"><option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option><option value="ar">AR</option></select>
<button id="customBtn" data-i18n="cta.custom"></button>
</div>
</header>

<main>
<section class="hero">
<h1 data-i18n="hero.title"></h1>
<p data-i18n="hero.subtitle"></p>
<ul>
<li data-i18n="hero.point1"></li>
<li data-i18n="hero.point2"></li>
<li data-i18n="hero.point3"></li>
</ul>
<button id="startBtn" data-i18n="hero.cta"></button>
</section>

<section id="form">
<h2 data-i18n="form.title"></h2>
<div class="form-badge"><span data-i18n="form.badge.cabinet"></span></div>
<p data-i18n="form.intro"></p>

<div class="form-help">
<h3 data-i18n="help.title"></h3>
<a id="pdfPrivacyLink" data-i18n="help.privacy"></a>
<a id="pdfGuideLink" data-i18n="help.guide"></a>
</div>

<form>
<label data-i18n="field.title.label"></label>
<input data-i18n-placeholder="field.title.ph">
<button type="submit" data-i18n="form.submit"></button>
<button type="reset" data-i18n="form.reset"></button>
</form>
</section>
</main>

<footer>
<p data-i18n="footer.text"></p>
</footer>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
