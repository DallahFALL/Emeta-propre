<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.title">e-META</title>
  <meta name="theme-color" content="#0b1020" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled />
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="site-header">
  <div class="container header-inner">

    <!-- Logo -->
    <a href="index.html" class="logo" aria-label="e-META">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
      <span class="logo-tagline" data-i18n="tagline">
        Assistant IA multilingue de prise de décision
      </span>
    </a>

    <!-- Burger -->
    <button class="burger" id="burgerBtn" type="button"
            aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <!-- Navigation -->
    <nav class="nav" id="mainNav" aria-label="Main navigation">
      <ul>
        <li><a href="#hero" data-i18n="nav.home">Accueil</a></li>
        <li><a href="#form" data-i18n="nav.form">Formulaire</a></li>
        <li><a href="privacy.html" data-i18n="nav.privacy">Confidentialité</a></li>
      </ul>
    </nav>

    <!-- Actions -->
    <div class="header-actions">
      <select id="languageSwitcher" class="lang-select" aria-label="Language selector">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ar">ع</option>
      </select>

      <a href="#form" class="header-cta" id="btnCustomRequest"
         data-i18n="btn.custom">
        Requête personnalisée
      </a>
    </div>

  </div>
</header>

<!-- ================= HERO ================= -->
<section class="hero" id="hero">
  <div class="container hero-inner">

    <div class="hero-text">
      <h1 data-i18n="hero.title">
        Donnez à vos décisions le niveau d’un cabinet de consulting premium
      </h1>

      <p class="hero-subtitle" data-i18n="hero.subtitle"></p>
      <p class="hero-subtext" data-i18n="hero.claim"></p>

      <button class="cta-primary" id="ctaStart" type="button"
              data-i18n="cta.start">
        Démarrer une analyse stratégique
      </button>

      <ul class="hero-points">
        <li data-i18n="hero.point1"></li>
        <li data-i18n="hero.point2"></li>
        <li data-i18n="hero.point3"></li>
      </ul>
    </div>

    <aside class="hero-panel">
      <div class="hero-badge">
        <span class="badge-title" data-i18n="hero.badge.title"></span>
        <span class="badge-text" data-i18n="hero.badge.text"></span>
      </div>
      <p class="hero-note" data-i18n="hero.note"></p>
    </aside>

  </div>
</section>

<!-- ================= FORM ================= -->
<section class="form-section" id="form">
  <div class="container">

    <h2 class="section-title" data-i18n="problem_title"></h2>
    <p class="section-intro" data-i18n="problem_intro"></p>

    <ul class="problem-list">
      <li data-i18n="problem_1"></li>
      <li data-i18n="problem_2"></li>
      <li data-i18n="problem_3"></li>
    </ul>

    <p class="section-intro" data-i18n="problem_transition"></p>

    <h2 class="section-title" data-i18n="form.title"></h2>
    <p class="section-intro" data-i18n="form.intro"></p>

    <!-- ================= FORMULAIRE MAKE (SAFE) ================= -->
    <form id="emetaForm" novalidate>

      <!-- 1. Infos générales -->
      <fieldset class="field-group">
        <legend>1. Informations générales</legend>

        <div class="field">
          <label for="domainMain">Domaine / Thème principal</label>
          <select id="domainMain" name="domainMain">
            <option value="">—</option>
            <option>Business / Strategy</option>
            <option>Marketing / Sales</option>
            <option>Finance</option>
            <option>HR / Organization</option>
            <option>Tech / Product</option>
            <option>Legal</option>
            <option>Other</option>
          </select>
        </div>

        <div class="field">
          <label for="projectType">Type de projet</label>
          <select id="projectType" name="projectType">
            <option value="">—</option>
            <option>Launch</option>
            <option>Optimization</option>
            <option>Audit</option>
            <option>Emergency</option>
            <option>Personal decision</option>
            <option>Other</option>
          </select>
        </div>

        <div class="field">
          <label for="projectTitle">Titre du projet / décision</label>
          <input type="text" id="projectTitle" name="projectTitle" />
        </div>
      </fieldset>

      <!-- 2. Analyse -->
      <fieldset class="field-group">
        <legend data-i18n="group.analysis"></legend>

        <div class="field">
          <label for="problem" data-i18n="field.problem.label"></label>
          <textarea id="problem" name="problem" rows="3"
            data-i18n-placeholder="field.problem.placeholder"></textarea>
        </div>

        <div class="field field-inline">
          <div class="field">
            <label for="objectives" data-i18n="field.objectives.label"></label>
            <textarea id="objectives" name="objectives" rows="3"
              data-i18n-placeholder="field.objectives.placeholder"></textarea>
          </div>

          <div class="field">
            <label for="constraints" data-i18n="field.constraints.label"></label>
            <textarea id="constraints" name="constraints" rows="3"
              data-i18n-placeholder="field.constraints.placeholder"></textarea>
          </div>
        </div>
      </fieldset>

      <!-- 3. Budget -->
      <fieldset class="field-group">
        <legend data-i18n="group.budget"></legend>

        <div class="field field-inline">
          <div class="field">
            <label for="budgetMin" data-i18n="field.budgetMin.label"></label>
            <input type="number" id="budgetMin" name="budgetMin" />
          </div>

          <div class="field">
            <label for="budgetMax" data-i18n="field.budgetMax.label"></label>
            <input type="number" id="budgetMax" name="budgetMax" />
          </div>
        </div>
      </fieldset>

      <!-- 4. Restitution -->
      <fieldset class="field-group">
        <legend>4. Mode de restitution</legend>

        <div class="options-grid">
          <label class="option">
            <input type="checkbox" name="outputEmail" />
            <span>Email</span>
          </label>

          <label class="option">
            <input type="checkbox" name="outputWhatsapp" />
            <span>WhatsApp</span>
          </label>

          <label class="option">
            <input type="checkbox" name="outputPdf" />
            <span>PDF</span>
          </label>

          <label class="option">
            <input type="checkbox" name="outputDisplay" />
            <span>Affichage direct</span>
          </label>
        </div>

        <div class="contact-grid">
          <div class="field">
            <label for="contactEmail">Email</label>
            <input type="email" id="contactEmail" name="contactEmail" />
          </div>

          <div class="field">
            <label for="contactWhatsapp">WhatsApp</label>
            <input type="tel" id="contactWhatsapp" name="contactWhatsapp" />
          </div>
        </div>

        <label class="option consent">
          <input type="checkbox" id="consent" name="consent" required />
          <span data-i18n="form.consent"></span>
        </label>
      </fieldset>

      <div id="formStatus" role="status" aria-live="polite"></div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" data-i18n="form.send"></button>
        <button type="reset" class="btn-secondary" data-i18n="form.reset"></button>
      </div>

    </form>

  </div>
</section>

<!-- ================= FOOTER ================= -->
<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-copy" data-i18n="footer.text"></p>
    <a href="privacy.html" class="footer-link" data-i18n="footer.privacy"></a>
  </div>
</footer>

<!-- Scripts -->
<script src="script.js"></script>
</body>
</html>
