<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="meta.title">e-META — Assistant IA</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled />

  <!-- JS -->
  <script defer src="i18n.js"></script>
  <script defer src="script.js"></script>
</head>

<body id="top">

<!-- =====================================================
     HEADER STICKY (DESKTOP + MOBILE)
===================================================== -->
<header class="site-header">
  <div class="container header-inner">

    <!-- LOGO -->
    <a class="logo" href="#top">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
      <span class="logo-tagline" data-i18n="header.tagline">
        Assistant IA multilingue de prise de décision
      </span>
    </a>

    <!-- NAV DESKTOP -->
    <nav class="nav" id="mainNav">
      <a href="#top" data-i18n="nav.home">Accueil</a>
      <a href="#form" data-i18n="nav.form">Formulaire</a>
      <a href="privacy.html" data-i18n="nav.privacy">Confidentialité</a>
    </nav>

    <!-- ACTIONS DESKTOP -->
    <div class="header-actions">
      <select class="lang-select" id="langSelect" aria-label="Langue">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ar">AR</option>
      </select>

      <button
        class="btn primary"
        type="button"
        id="customBtn"
        data-i18n="cta.custom"
        onclick="document.getElementById('form').scrollIntoView({behavior:'smooth'})"
      >
        Requête personnalisée
      </button>
    </div>

    <!-- BURGER MOBILE -->
    <button
      class="burger"
      id="burgerBtn"
      type="button"
      aria-label="Menu"
      aria-expanded="false"
      aria-controls="mobilePanel"
    >
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- ===== MOBILE PANEL ===== -->
  <div class="container mobile-panel" id="mobilePanel">
    <nav class="nav">
      <a href="#top" data-i18n="nav.home">Accueil</a>
      <a href="#form" data-i18n="nav.form">Formulaire</a>
      <a href="privacy.html" data-i18n="nav.privacy">Confidentialité</a>
    </nav>

    <div class="actions">
      <select
        class="lang-select"
        aria-label="Langue mobile"
        onchange="
          document.getElementById('langSelect').value=this.value;
          document.getElementById('langSelect').dispatchEvent(new Event('change'));
        "
      >
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ar">AR</option>
      </select>

      <button
        class="btn primary"
        type="button"
        onclick="document.getElementById('form').scrollIntoView({behavior:'smooth'})"
        data-i18n="cta.custom"
      >
        Requête personnalisée
      </button>
    </div>
  </div>
</header>

<!-- =====================================================
     MAIN
===================================================== -->
<main>

  <!-- ================= HERO ================= -->
  <section class="hero" id="hero">
    <div class="container hero-grid">

      <!-- LEFT -->
      <div class="card hero-box">
        <h1 data-i18n="hero.title">
          Donnez à vos décisions le niveau d’un cabinet de conseil premium
        </h1>

        <p class="hero-subtitle" data-i18n="hero.subtitle"></p>

        <ul class="hero-points">
          <li data-i18n="hero.point1"></li>
          <li data-i18n="hero.point2"></li>
          <li data-i18n="hero.point3"></li>
        </ul>

        <div class="cta-row">
          <button
            class="btn primary"
            type="button"
            id="startBtn"
            data-i18n="hero.cta"
            onclick="document.getElementById('form').scrollIntoView({behavior:'smooth'})"
          >
            Commencer une analyse stratégique
          </button>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="card hero-box muted">
        <div class="hero-badge">
          <span class="badge-title" data-i18n="hero.badge.title"></span>
          <span class="badge-text" data-i18n="hero.badge.text"></span>
        </div>
        <p class="hero-note" data-i18n="hero.note"></p>
      </div>

    </div>
  </section>

  <!-- ================= FORM ================= -->
  <section class="form-section" id="form">
    <div class="container">

      <h2 class="section-title" data-i18n="form.title"></h2>
      <p class="form-intro" data-i18n="form.intro"></p>

      <!-- ===== FORMULAIRE INTACT ===== -->
      <!-- (STRICTEMENT identique à celui que tu as fourni) -->

      <!-- ⬇️ ICI : le formulaire COMPLET que tu as donné,
           inchangé ligne par ligne ⬇️ -->

      <!-- 👉 JE NE LE RÉPÈTE PAS ICI pour alléger la réponse,
           MAIS DANS TON COLLAGE FINAL :
           TU GARDES EXACTEMENT LE FORMULAIRE QUE TU AS FOURNI
           (du <form id="emetaForm"> jusqu’à </form>) -->

    </div>
  </section>

</main>

<!-- =====================================================
     FOOTER
===================================================== -->
<footer class="site-footer">
  <div class="container footer-inner">
    <p data-i18n="footer.text"></p>
    <a class="footer-link" href="privacy.html" data-i18n="footer.privacy"></a>
    <p class="footer-copy" data-i18n="footer.copy"></p>
  </div>
</footer>

</body>
</html>
