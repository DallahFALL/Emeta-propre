<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-META</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./rtl.css" id="rtlStylesheet" disabled>
  <script src="./script.js" defer></script>
</head>

<body>

<header class="site-header">
  <div class="container header-inner">

    <div class="logo">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
      <span class="logo-tagline" data-i18n="header.tagline"></span>
    </div>

    <nav id="mainNav" class="nav">
      <ul>
        <li><a href="#home" data-i18n="nav.home"></a></li>
        <li><a href="#form" data-i18n="nav.form"></a></li>
        <li><a href="privacy.html" data-i18n="nav.privacy"></a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <select id="languageSwitcher" class="lang-select">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ar">AR</option>
      </select>

      <button id="ctaRequest" class="btn-whatsapp" data-i18n="btn.customRequest"></button>

      <button id="burgerBtn" class="burger" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>
</header>

<main id="home">

<section class="hero">
  <div class="container hero-inner">

    <div class="hero-text">
      <h1 data-i18n="hero.title"></h1>
      <p class="hero-subtitle" data-i18n="hero.subtitle"></p>

      <div class="hero-cta">
        <button class="cta-primary" data-i18n="hero.cta"></button>
      </div>
    </div>

    <div class="hero-panel">
      <p data-i18n="hero.panel"></p>
    </div>

  </div>
</section>

<!-- FORM -->
<section id="form" class="form-section">
  <div class="container">

    <h2 data-i18n="form.title"></h2>
    <p class="form-intro" data-i18n="form.intro"></p>

    <!-- ⚠️ FORMULAIRE EXISTANT CONSERVÉ
         👉 seuls labels / placeholders ont data-i18n
         👉 ta structure actuelle est OK -->
    
  </div>
</section>

</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span data-i18n="footer.text"></span>
    <a href="privacy.html" class="footer-link" data-i18n="footer.privacy"></a>
  </div>
</footer>

</body>
</html>
