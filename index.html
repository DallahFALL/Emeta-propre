<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-META — Assistant IA</title>

  <style>
    :root {
      --bg-main: #070b1a;
      --bg-card: rgba(255,255,255,0.04);
      --border-soft: rgba(255,255,255,0.08);
      --text-main: #ffffff;
      --text-muted: rgba(255,255,255,0.75);
      --accent: #ff8a00;
      --radius: 18px;
      --max-width: 1200px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background: linear-gradient(180deg, #060918, #090d22);
      color: var(--text-main);
    }

    a { color: inherit; text-decoration: none; }

    /* ===== HEADER ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(6,9,24,0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-soft);
    }

    .header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      font-weight: 800;
      font-size: 1.2rem;
    }

    .logo span { color: var(--accent); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cta {
      background: var(--accent);
      color: #000;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* ===== MAIN ===== */
    main {
      padding: 40px 16px 80px;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
    }

    /* ===== HERO ===== */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 28px;
    }

    h1 {
      font-size: 1.8rem;
      margin-top: 0;
    }

    p {
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* ===== FORM ===== */
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: rgba(255,255,255,0.03);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      grid-column: 1 / -1;
    }

    .full {
      grid-column: 1 / -1;
    }

    button.submit {
      grid-column: 1 / -1;
      margin-top: 10px;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      padding: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo"><span>e</span>-META</div>
    <div class="nav-right">
      <a href="privacy.html">Confidentialité</a>
      <a class="cta" href="#form">Requête personnalisée</a>
    </div>
  </div>
</header>

<main>
  <div class="container">

    <section class="hero">
      <div class="card">
        <h1>Donnez à vos décisions le niveau d’un cabinet de conseil premium</h1>
        <p>
          e-META structure votre contexte, objectifs et contraintes
          afin de produire une recommandation claire, actionnable et documentée.
        </p>
      </div>

      <div class="card"></div>
    </section>

    <section class="card" id="form">
      <form>

        <div class="field">
          <label>Domaine</label>
          <select>
            <option>Business / Stratégie</option>
            <option>Finance</option>
            <option>Marketing</option>
            <option>Projet</option>
          </select>
        </div>

        <div class="field">
          <label>Niveau d’urgence</label>
          <select>
            <option>Faible</option>
            <option>Moyen</option>
            <option>Élevé</option>
          </select>
        </div>

        <div class="field full">
          <label>Objectif principal</label>
          <input type="text" placeholder="Décrivez l’objectif à atteindre">
        </div>

        <div class="field full">
          <label>Contexte et contraintes</label>
          <textarea placeholder="Expliquez la situation, les limites, les risques…"></textarea>
        </div>

        <button class="submit">Lancer l’analyse</button>

      </form>
    </section>

  </div>
</main>

</body>
</html>
