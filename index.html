<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-META – Assistant IA pluridisciplinaire</title>

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>

  <!-- HEADER injecté automatiquement -->
  <div id="headerContainer"></div>

  <!-- HERO -->
  <section id="home" class="hero">
    <div class="hero-inner">
      <div class="hero-badge" data-i18n="badge_ai">IA décisionnelle</div>
      <h1 data-i18n="hero_title">e-META — L’assistant IA pluridisciplinaire</h1>
      <p class="hero-sub" data-i18n="hero_sub">
        Formulaire intelligent pour analyser, diagnostiquer et recommander des solutions adaptées.
      </p>
    </div>
  </section>

  <!-- FORMULAIRE DÉCISIONNEL -->
  <section class="emeta-section">
    <div class="form-wrapper">
      <h2 class="form-title" data-i18n="form_title">Requête décisionnelle e-META</h2>

      <form id="emetaForm" class="emeta-form">

        <!-- Identité -->
        <div class="emeta-group">
          <label data-i18n="label_fullname">Nom complet</label>
          <input type="text" id="fullname" placeholder="ex : Abdoulaye FALL" />
        </div>

        <div class="emeta-row">
          <div class="emeta-group">
            <label data-i18n="label_email">Email (optionnel)</label>
            <input type="email" id="email" placeholder="ex : contact@e-meta.app" />
          </div>

          <div class="emeta-group">
            <label data-i18n="label_phone">Téléphone WhatsApp (optionnel)</label>
            <input type="tel" id="phone" placeholder="+221 77 000 00 00" />
          </div>
        </div>

        <!-- Sélection du domaine -->
        <div class="emeta-group">
          <label data-i18n="label_domain">Domaine / Thème</label>
          <select id="domainSelect"></select>
        </div>

        <!-- Titre -->
        <div class="emeta-group">
          <label data-i18n="label_title">Titre court de la décision</label>
          <input type="text" id="decision_title" placeholder="ex : Lancement d’une station-service" />
        </div>

        <!-- Contexte -->
        <div class="emeta-group">
          <label data-i18n="label_context">Contexte détaillé</label>
          <textarea id="context" placeholder="Décrivez la situation actuelle…"></textarea>
        </div>

        <!-- Objectifs -->
        <div class="emeta-group">
          <label data-i18n="label_objectives">Objectifs recherchés</label>
          <textarea id="objectives" placeholder="Quels résultats attendez-vous ?"></textarea>
        </div>

        <!-- Contraintes -->
        <div class="emeta-group">
          <label data-i18n="label_constraints">Contraintes / limites</label>
          <textarea id="constraints" placeholder="Contraintes techniques, financières, légales…"></textarea>
        </div>

        <!-- Budget -->
        <div class="emeta-row">
          <div class="emeta-group">
            <label data-i18n="label_budget">Budget indicatif</label>
            <input type="number" id="budget_amount" placeholder="ex : 70000" />
          </div>

          <div class="emeta-group">
            <label data-i18n="label_currency">Devise</label>
            <select id="currencySelect"></select>
          </div>
        </div>

        <!-- Deadline + Urgency -->
        <div class="emeta-row">
          <div class="emeta-group">
            <label data-i18n="label_deadline">Délai souhaité</label>
            <input type="text" id="deadline" placeholder="ex : 30 jours" />
          </div>

          <div class="emeta-group">
            <label data-i18n="label_urgency">Urgence (1–5)</label>
            <input type="number" id="urgency" min="1" max="5" value="3" />
          </div>
        </div>

        <!-- Delivery mode -->
        <fieldset class="emeta-fieldset">
          <legend data-i18n="label_delivery">Mode de restitution</legend>

          <label><input type="radio" name="delivery" value="auto" checked />
            <span data-i18n="delivery_auto">Automatique</span>
          </label>

          <label><input type="radio" name="delivery" value="email" />
            <span data-i18n="delivery_email">Email</span>
          </label>

          <label><input type="radio" name="delivery" value="whatsapp" />
            <span data-i18n="delivery_whatsapp">WhatsApp</span>
          </label>

          <label><input type="radio" name="delivery" value="display" />
            <span data-i18n="delivery_display">Affichage direct</span>
          </label>
        </fieldset>

        <!-- File URL -->
        <div class="emeta-group">
          <label data-i18n="label_file">Lien fichier (optionnel)</label>
          <input type="url" id="attachment" placeholder="URL Google Drive, PDF…" />
        </div>

        <!-- Consent -->
        <label class="emeta-consent">
          <input type="checkbox" id="consent" />
          <span data-i18n="label_consent">
            J’autorise e-META à analyser mes données.
          </span>
          <a href="privacy.html" class="emeta-privacy-link" data-i18n="label_privacy">Voir la politique de confidentialité</a>
        </label>

        <!-- Buttons -->
        <div class="emeta-buttons">
          <button type="button" id="resetBtn" class="btn-secondary" data-i18n="btn_reset">Réinitialiser</button>
          <button type="button" id="sendBtn" class="btn-primary" data-i18n="btn_send">Envoyer</button>
        </div>
      </form>
    </div>
  </section>

  <!-- Footer injecté automatiquement -->
  <div id="footerContainer"></div>

</body>
</html>
