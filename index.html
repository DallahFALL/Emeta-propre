<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="app.title">e-META – Assistant IA Multilingue</title>
  <!-- ✅ Chargement du CSS avec anti-cache -->
  <link rel="stylesheet" href="styles.css?v=2.0" />
</head>

<body>
  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <h1 class="title" data-i18n="header.title">e-META – Assistant IA de Prise de Décision</h1>
    <p class="subtitle" data-i18n="header.subtitle">
      Formulaire central — Répondez et envoyez par WhatsApp ou Email
    </p>
  </header>

  <!-- ================= FORMULAIRE ================= -->
  <main class="container">
    <form id="emetaForm" class="card" novalidate>
      
      <!-- Langue et Devise -->
      <div class="grid grid-2">
        <div class="field">
          <label for="lang" data-i18n="form.language">Langue</label>
          <select id="lang" name="lang" aria-label="Language selector">
            <option value="fr">Français (FR)</option>
            <option value="en">English (EN)</option>
            <option value="es">Español (ES)</option>
            <option value="ar">العربية (AR)</option>
          </select>
        </div>

        <div class="field">
          <label for="currency" data-i18n="form.currency">Devise</label>
          <select id="currency" name="currency">
            <option value="USD">USD — US Dollar</option>
            <option value="EUR">EUR — Euro</option>
            <option value="GBP">GBP — Pound Sterling</option>
            <option value="XOF">XOF — Franc CFA (UEMOA)</option>
            <option value="XAF">XAF — Franc CFA (CEMAC)</option>
            <option value="CFA">CFA — Franc CFA (Générique)</option>
          </select>
        </div>
      </div>

      <!-- Identité -->
      <div class="grid grid-2">
        <div class="field">
          <label for="fullname" data-i18n="form.fullname">Nom complet</label>
          <input id="fullname" name="fullname" type="text" placeholder="Votre nom" required />
        </div>
        <div class="field">
          <label for="email" data-i18n="form.email">Email</label>
          <input id="email" name="email" type="email" placeholder="nom@domaine.com" />
        </div>
      </div>

      <!-- Téléphone & Domaine -->
      <div class="grid grid-2">
        <div class="field">
          <label for="phone" data-i18n="form.phone">Téléphone (WhatsApp)</label>
          <input id="phone" name="phone" type="tel" placeholder="+221770000000" />
        </div>
        <div class="field">
          <label for="domain" data-i18n="form.domain">Domaine</label>
          <select id="domain" name="domain" required>
            <option value="" selected disabled data-i18n="form.chooseDomain">— Choisir un domaine —</option>
            <option value="agriculture" data-i18n="domain.agriculture">Agriculture</option>
            <option value="commerce" data-i18n="domain.commerce">Commerce & Distribution</option>
            <option value="ecommerce" data-i18n="domain.ecommerce">E-commerce</option>
            <option value="fintech" data-i18n="domain.fintech">FinTech / Mobile Money</option>
            <option value="sante" data-i18n="domain.sante">Santé</option>
            <option value="education" data-i18n="domain.education">Éducation</option>
            <option value="immobilier" data-i18n="domain.immobilier">Immobilier</option>
            <option value="transport" data-i18n="domain.transport">Transport & Logistique</option>
            <option value="energie" data-i18n="domain.energie">Énergie & Solaire</option>
            <option value="tourisme" data-i18n="domain.tourisme">Tourisme</option>
            <option value="technologie" data-i18n="domain.technologie">Technologie & IA</option>
            <option value="juridique" data-i18n="domain.juridique">Juridique</option>
            <option value="finance" data-i18n="domain.finance">Finance & Comptabilité</option>
            <option value="rh" data-i18n="domain.rh">Ressources Humaines</option>
            <option value="marketing" data-i18n="domain.marketing">Marketing & Communication</option>
            <option value="industrie" data-i18n="domain.industrie">Industrie & Fabrication</option>
            <option value="environnement" data-i18n="domain.environnement">Environnement</option>
            <option value="public" data-i18n="domain.public">Projets Publics & Collectivités</option>
            <option value="autre" data-i18n="domain.autre">Autre</option>
          </select>
        </div>
      </div>

      <!-- Champs conditionnels -->
      <div id="conditionalFields" class="stack"></div>

      <!-- Objet et Détails -->
      <div class="field">
        <label for="subject" data-i18n="form.subject">Objet</label>
        <input id="subject" name="subject" type="text" placeholder="Titre de votre requête" required />
      </div>

      <div class="field">
        <label for="details" data-i18n="form.details">Détails</label>
        <textarea id="details" name="details" rows="5" placeholder="Expliquez votre besoin…"></textarea>
      </div>

      <!-- Requête personnalisée -->
      <div class="field checkbox">
        <input id="customReq" name="customReq" type="checkbox" />
        <label for="customReq" data-i18n="form.customReq">Requête personnalisée</label>
      </div>

      <div id="customReqBlock" class="field" hidden>
        <label for="customDetails" data-i18n="form.customDetails">Détails de la requête personnalisée</label>
        <textarea id="customDetails" name="customDetails" rows="4" placeholder="Décrivez votre cas spécifique…"></textarea>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button type="button" id="whatsappButton" class="btn whatsapp" aria-label="Envoyer sur WhatsApp">
          🟢 <span data-i18n="btn.whatsapp">WhatsApp</span>
        </button>
        <button type="submit" class="btn primary" data-i18n="btn.submit">Envoyer par Email</button>
        <button type="reset" class="btn ghost" data-i18n="btn.reset">Réinitialiser</button>
      </div>

      <p class="small muted" data-i18n="form.note">
        Astuce : si vous renseignez votre numéro WhatsApp, le message est pré-rempli et prêt à envoyer.
      </p>
    </form>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <p class="small">
      <span data-i18n="footer.rights">©</span>
      <span id="year"></span> e-META •
      <span data-i18n="footer.tag">Simplement. Intelligemment.</span>
    </p>
  </footer>

  <!-- Scripts -->
  <script src="script.js?v=2.0" defer></script>
</body>
</html>
