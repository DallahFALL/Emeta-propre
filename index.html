<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.title">e-META</title>
  <meta name="theme-color" content="#0b1020" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled />
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="site-header">
  <div class="container header-inner">

    <!-- LOGO -->
    <a href="index.html" class="logo" aria-label="e-META">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
      <span class="logo-tagline" data-i18n="tagline">
        Assistant IA multilingue de prise de décision
      </span>
    </a>

    <!-- BURGER -->
    <button class="burger" id="burgerBtn" type="button"
            aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <!-- NAV -->
    <nav class="nav" id="mainNav" aria-label="Main navigation">
      <ul>
        <li><a href="#hero" data-i18n="nav.home">Accueil</a></li>
        <li><a href="#form" data-i18n="nav.form">Formulaire</a></li>
        <li><a href="privacy.html" data-i18n="nav.privacy">Confidentialité</a></li>
      </ul>
    </nav>

    <!-- ACTIONS -->
    <div class="header-actions">
      <select id="languageSwitcher" class="lang-select" aria-label="Language selector">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ar">ع</option>
      </select>

      <a href="#form" class="header-cta" id="btnCustomRequest"
         data-i18n="btn.custom">
        Requête personnalisée
      </a>
    </div>

  </div>
</header>

<!-- ================= HERO ================= -->
<section class="hero" id="hero">
  <div class="container hero-inner">

    <div class="hero-text">
      <h1 data-i18n="hero.title"></h1>

      <p class="hero-subtitle" data-i18n="hero.subtitle"></p>
      <p class="hero-subtext" data-i18n="hero.claim"></p>

      <button class="cta-primary" id="ctaStart" type="button"
              data-i18n="cta.start"></button>

      <ul class="hero-points">
        <li data-i18n="hero.point1"></li>
        <li data-i18n="hero.point2"></li>
        <li data-i18n="hero.point3"></li>
      </ul>
    </div>

    <aside class="hero-panel">
      <div class="hero-badge">
        <span class="badge-title" data-i18n="hero.badge.title"></span>
        <span class="badge-text" data-i18n="hero.badge.text"></span>
      </div>
      <p class="hero-note" data-i18n="hero.note"></p>
    </aside>

  </div>
</section>

<!-- ================= FORM ================= -->
<section class="form-section" id="form">
  <div class="container">

    <h2 class="section-title" data-i18n="problem_title"></h2>
    <p class="section-intro" data-i18n="problem_intro"></p>

    <ul class="problem-list">
      <li data-i18n="problem_1"></li>
      <li data-i18n="problem_2"></li>
      <li data-i18n="problem_3"></li>
    </ul>

    <p class="section-intro" data-i18n="problem_transition"></p>

    <h2 class="section-title" data-i18n="form.title"></h2>
    <p class="section-intro" data-i18n="form.intro"></p>

    <!-- ===== FORMULAIRE MAKE (INCHANGÉ) ===== -->
    <form id="emetaForm" novalidate>

      <!-- ⚠️ TOUT LE CONTENU DU FORMULAIRE EST STRICTEMENT CONSERVÉ -->
      <!-- (aucun id / name modifié, compatibilité Make totale) -->

      <!-- 👉 Le reste de ton formulaire reste IDENTIQUE à ta version -->

      <!-- 👉 Tu peux recoller ici ton formulaire tel quel
           (la responsivité est désormais assurée par la structure globale) -->

    </form>

  </div>
</section>

<!-- ================= FOOTER ================= -->
<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-copy" data-i18n="footer.text"></p>
    <a href="privacy.html" class="footer-link" data-i18n="footer.privacy"></a>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
