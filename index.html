<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>e-META</title>
  <meta name="theme-color" content="#0b1020" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled />
</head>

<body>

<header class="site-header">
  <div class="container header-inner">

    <!-- LOGO -->
    <a href="index.html" class="logo">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
      <span class="logo-tagline" data-i18n="tagline"></span>
    </a>

    <!-- BURGER -->
    <button
      class="burger"
      id="burgerBtn"
      aria-label="Menu"
      aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <!-- NAV -->
    <nav class="nav" id="mainNav">
      <ul>
        <li><a href="#hero" data-i18n="nav.home"></a></li>
        <li><a href="#form" data-i18n="nav.form"></a></li>
        <li><a href="privacy.html" data-i18n="nav.privacy"></a></li>
      </ul>
    </nav>

    <!-- ACTIONS -->
    <div class="header-actions">
      <select id="languageSwitcher" class="lang-select">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ar">ع</option>
      </select>

      <button
        id="ctaRequest"
        class="btn-whatsapp whatsappBtnGlobal"
        data-i18n="btn.customRequest">
      </button>
    </div>

  </div>
</header>

<main>

<!-- HERO -->
<section id="hero" class="hero">
  <div class="container hero-inner">

    <div class="hero-text">
      <h1 data-i18n="hero.title"></h1>

      <p class="hero-subtitle" data-i18n="hero.subtitle"></p>

      <p class="hero-subtext" data-i18n="hero.note"></p>

      <div class="hero-cta">
        <a href="#form" class="btn-primary" data-i18n="hero.cta"></a>
      </div>
    </div>

    <div class="hero-panel">
      <p data-i18n="hero.panel"></p>
      <ul class="hero-list">
        <li data-i18n="hero.point1"></li>
        <li data-i18n="hero.point2"></li>
        <li data-i18n="hero.point3"></li>
      </ul>
    </div>

  </div>
</section>

<!-- FORM -->
<section id="form" class="form-section">
  <div class="container">

    <h2 data-i18n="form.title"></h2>
    <p class="form-intro" data-i18n="form.intro"></p>

    <!-- ⚠ FORMULAIRE EXISTANT CONSERVÉ -->
    <!-- Seuls labels / placeholders doivent recevoir data-i18n -->
    <!-- Tu peux continuer champ par champ -->
<form id="form">

  <fieldset class="field-group">
    <legend data-i18n="form.section.general"></legend>

    <div class="field">
      <label data-i18n="form.domain"></label>
      <select name="domain">
        <option value="" data-i18n="form.choose"></option>
        <option value="business" data-i18n="domain.business"></option>
        <option value="tech" data-i18n="domain.tech"></option>
        <option value="agriculture" data-i18n="domain.agriculture"></option>
        <option value="finance" data-i18n="domain.finance"></option>
        <option value="other" data-i18n="domain.other"></option>
      </select>
    </div>

    <div class="field">
      <label data-i18n="form.projectType"></label>
      <input type="text" name="projectType" data-i18n-placeholder="form.projectType.ph">
    </div>

    <div class="field">
      <label data-i18n="form.projectTitle"></label>
      <input type="text" name="projectTitle" data-i18n-placeholder="form.projectTitle.ph">
    </div>
  </fieldset>

  <fieldset class="field-group">
    <legend data-i18n="form.section.analysis"></legend>

    <div class="field">
      <label data-i18n="form.problem"></label>
      <textarea name="problem" data-i18n-placeholder="form.problem.ph"></textarea>
    </div>

    <div class="field">
      <label data-i18n="form.objectives"></label>
      <textarea name="objectives" data-i18n-placeholder="form.objectives.ph"></textarea>
    </div>

    <div class="field">
      <label data-i18n="form.constraints"></label>
      <textarea name="constraints" data-i18n-placeholder="form.constraints.ph"></textarea>
    </div>

    <div class="field">
      <label data-i18n="form.kpis"></label>
      <textarea name="kpis" data-i18n-placeholder="form.kpis.ph"></textarea>
    </div>
  </fieldset>

  <fieldset class="field-group">
    <legend data-i18n="form.section.restitution"></legend>

    <div class="checkbox-grid">
      <label><input type="checkbox" name="want_email"> <span data-i18n="restitution.email"></span></label>
      <label><input type="checkbox" name="want_whatsapp"> <span data-i18n="restitution.whatsapp"></span></label>
      <label><input type="checkbox" name="want_pdf"> <span data-i18n="restitution.pdf"></span></label>
      <label><input type="checkbox" name="want_display"> <span data-i18n="restitution.display"></span></label>
    </div>

    <div class="field">
      <label data-i18n="form.email"></label>
      <input type="email" name="email" data-i18n-placeholder="form.email.ph">
    </div>

    <div class="field">
      <label data-i18n="form.whatsapp"></label>
      <input type="tel" name="whatsapp" data-i18n-placeholder="form.whatsapp.ph">
    </div>
  </fieldset>

  <div class="form-actions">
    <button type="submit" class="btn-primary" data-i18n="form.submit"></button>
    <button type="reset" class="btn-secondary" data-i18n="form.reset"></button>
  </div>

</form>

  </div>
</section>

</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p data-i18n="footer.text"></p>
    <a href="privacy.html" class="footer-link" data-i18n="footer.privacy"></a>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
