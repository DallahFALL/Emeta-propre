<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>e-META — Assistant IA de prise de décision</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled />
</head>

<body id="top">

<!-- ================= HEADER ================= -->
<header class="site-header">
  <div class="container header-inner">

    <div class="logo">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
      <span class="logo-tagline" data-i18n="footer.tagline">
        Assistant IA multilingue de prise de décision
      </span>
    </div>

    <button class="burger" id="burgerBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="mainNav">
      <a href="#top" data-i18n="nav.home">Accueil</a>
      <a href="#form" data-i18n="nav.form">Analyse</a>
      <a href="privacy.html" data-i18n="nav.privacy">Confidentialité</a>
    </nav>

    <div class="header-actions">
      <select class="lang-select" id="langSelect">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="ar">AR</option>
      </select>

      <button class="cta-custom" onclick="scrollToForm()" data-i18n="cta.custom">
        Requête personnalisée
      </button>
    </div>

  </div>
</header>

<main>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="container hero-grid">

    <div class="hero-box">
      <h1 data-i18n="hero.title">
        Prenez des décisions au niveau d’un cabinet de conseil premium
      </h1>

      <p data-i18n="hero.subtitle">
        e-META transforme votre situation complexe en une synthèse stratégique claire.
      </p>

      <ul class="hero-points">
        <li data-i18n="hero.points.0"></li>
        <li data-i18n="hero.points.1"></li>
        <li data-i18n="hero.points.2"></li>
      </ul>

      <button class="cta-primary" onclick="scrollToForm()" data-i18n="cta.start">
        Démarrer une analyse stratégique
      </button>
    </div>

    <div class="hero-box muted">
      <p data-i18n="hero.sideNote"></p>
      <p class="small" data-i18n="hero.sideSub"></p>
    </div>

  </div>
</section>

<!-- ================= FORM ================= -->
<section class="form-section" id="form">
  <div class="container">

    <h2 class="section-title" data-i18n="form.title"></h2>

    <form class="emeta-form">

      <!-- CONTEXTE -->
      <div class="form-card">
        <h3 data-i18n="form.context.title"></h3>

        <div class="grid-2">
          <div>
            <label data-i18n="form.context.country"></label>
            <input type="text" data-i18n-placeholder="form.context.country_ph">
          </div>
          <div>
            <label data-i18n="form.context.sector"></label>
            <input type="text" data-i18n-placeholder="form.context.sector_ph">
          </div>
        </div>

        <label data-i18n="form.context.project"></label>
        <textarea data-i18n-placeholder="form.context.project_ph"></textarea>
      </div>

      <!-- OBJECTIFS -->
      <div class="form-card">
        <h3 data-i18n="form.objectives.title"></h3>

        <label data-i18n="form.objectives.goals"></label>
        <textarea data-i18n-placeholder="form.objectives.goals_ph"></textarea>

        <label data-i18n="form.objectives.kpi"></label>
        <textarea data-i18n-placeholder="form.objectives.kpi_ph"></textarea>
      </div>

      <!-- RISQUES -->
      <div class="form-card">
        <h3 data-i18n="form.risks.title"></h3>

        <label data-i18n="form.risks.main"></label>
        <textarea data-i18n-placeholder="form.risks.main_ph"></textarea>

        <label data-i18n="form.risks.scenarios"></label>
        <textarea data-i18n-placeholder="form.risks.scenarios_ph"></textarea>
      </div>

      <!-- THEMES -->
      <fieldset class="field-group">
        <legend data-i18n="form.themes.title"></legend>

        <div class="checkbox-grid">
          <label class="check-item"><input type="checkbox"> <span data-i18n="form.themes.ai"></span></label>
          <label class="check-item"><input type="checkbox"> <span data-i18n="form.themes.scaling"></span></label>
          <label class="check-item"><input type="checkbox"> <span data-i18n="form.themes.costs"></span></label>
          <label class="check-item"><input type="checkbox"> <span data-i18n="form.themes.esg"></span></label>
          <label class="check-item"><input type="checkbox"> <span data-i18n="form.themes.regulation"></span></label>
          <label class="check-item"><input type="checkbox"> <span data-i18n="form.themes.innovation"></span></label>
        </div>
      </fieldset>

      <!-- SUBMIT -->
      <div class="form-actions">
        <button class="btn-submit" data-i18n="cta.submit"></button>
      </div>

    </form>

  </div>
</section>

</main>

<!-- ================= FOOTER ================= -->
<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <strong><span style="color:#ff8a00">e</span>-META</strong>
      <p data-i18n="footer.tagline"></p>
    </div>
  </div>

  <div class="footer-copy">
    © 2025 e-META — <span data-i18n="footer.rights"></span>
  </div>
</footer>

<!-- ================= SCRIPTS ================= -->
<script src="i18n.js"></script>

<script>
function scrollToForm() {
  document.getElementById("form")?.scrollIntoView({ behavior: "smooth" });
}

const burger = document.getElementById("burgerBtn");
const nav = document.getElementById("mainNav");
burger?.addEventListener("click", () => nav.classList.toggle("open"));

const select = document.getElementById("langSelect");
const rtl = document.getElementById("rtlStylesheet");

function applyI18n(lang) {
  const dict = I18N[lang];
  if (!dict) return;

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  rtl.disabled = lang !== "ar";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const keys = el.dataset.i18n.split(".");
    let val = dict;
    keys.forEach(k => val = val?.[k]);
    if (val) el.textContent = val;
  });

  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const keys = el.dataset.i18nPlaceholder.split(".");
    let val = dict;
    keys.forEach(k => val = val?.[k]);
    if (val) el.placeholder = val;
  });

  localStorage.setItem("lang", lang);
}

const savedLang = localStorage.getItem("lang") || "fr";
select.value = savedLang;
applyI18n(savedLang);
select.addEventListener("change", e => applyI18n(e.target.value));
</script>

</body>
</html>
