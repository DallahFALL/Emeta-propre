<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="e-META — Assistant IA multilingue de prise de décision. Analyse stratégique niveau consulting premium." />
  <title>e-META – Assistant IA de prise de décision</title>

  <!-- FAVICON -->
  <link rel="icon" href="favicon.png" />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- GOOGLE FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- ======================================== -->
  <!--                HEADER                    -->
  <!-- ======================================== -->
  <header class="site-header">
    <div class="container header-inner">

      <!-- LOGO -->
      <a href="index.html" class="logo">
        <span class="logo-mark">e</span>
        <span class="logo-text">META</span>
        <span class="logo-tagline" data-i18n="tagline">
          Assistant IA multilingue de prise de décision
        </span>
      </a>

      <!-- TAGLINE -->
      <span class="logo-tagline" data-i18n="tagline"></span>

      <!-- NAVIGATION -->
      <nav class="main-nav">
        <ul>
          <li><a href="index.html" data-i18n="menu.home"></a></li>
          <li><a href="#form-section" data-i18n="menu.form"></a></li>
          <li><a href="privacy.html" data-i18n="menu.privacy"></a></li>
        </ul>
      </nav>

      <!-- LANGUAGE SWITCHER -->
      <select id="languageSwitcher" onchange="setLanguage(this.value)">
        <option value="fr">FR</option>
        <option value="es">ES</option>
        <option value="ar">AR</option>
        <option value="en">EN</option>
      </select>

      <!-- CTA BUTTON -->
      <a href="#form-section" class="btn-custom" data-i18n="menu.custom"></a>

    </div>
  </header>

  <!-- ======================================== -->
  <!--               HERO SECTION               -->
  <!-- ======================================== -->
  <section class="hero">
    <div class="container hero-inner">

      <div class="hero-text">
        <h1 data-i18n="hero.title">Donnez à vos décisions le niveau d’un cabinet de consulting premium</h1>

        <p data-i18n="hero.subtitle">
          e-META analyse votre contexte, vos objectifs, vos contraintes et vos ressources pour générer une feuille de route claire et exploitable.
        </p>

        <ul class="hero-points">
          <li data-i18n="hero.point1"></li>
          <li data-i18n="hero.point2"></li>
          <li data-i18n="hero.point3"></li>
        </ul>

        <a href="#form-section" class="btn-primary" data-i18n="hero.button"></a>
      </div>

    </div>
  </section>

  <!-- ======================================== -->
  <!--              FORMULAIRE PRO              -->
  <!-- ======================================== -->
  <section id="form-section" class="form-section container">

    <form id="emeta-form">

      <!-- SECTION 1 -->
      <h3 class="form-section-title" data-i18n="form.section1">1. INFORMATIONS GÉNÉRALES</h3>

      <label data-i18n="form.domain"></label>
      <select id="domain">
        <option value="" data-i18n="form.select"></option>
        <option data-i18n="domain.hr"></option>
        <option data-i18n="domain.strategy"></option>
        <option data-i18n="domain.finance"></option>
        <option data-i18n="domain.marketing"></option>
        <option data-i18n="domain.tech"></option>
        <option data-i18n="domain.operations"></option>
        <option data-i18n="domain.risk"></option>
        <option data-i18n="domain.other"></option>
      </select>

      <label data-i18n="form.projectType"></label>
      <select id="project-type">
        <option value="" data-i18n="form.projectType.placeholder"></option>
        <option data-i18n="ptype.analysis"></option>
        <option data-i18n="ptype.market"></option>
        <option data-i18n="ptype.plan"></option>
        <option data-i18n="ptype.optimization"></option>
        <option data-i18n="ptype.organization"></option>
        <option data-i18n="ptype.risk"></option>
        <option data-i18n="ptype.problem"></option>
      </select>

      <label data-i18n="form.shortTitle"></label>
      <input type="text"
        id="short-title"
        data-placeholder="form.shortTitle.placeholder"
        placeholder="" />

      <!-- SECTION 2 -->
      <h3 class="form-section-title" data-i18n="form.section2"></h3>

      <label data-i18n="form.coreProblem"></label>
      <textarea id="core-problem"
        data-placeholder="form.coreProblem.placeholder"
        placeholder=""></textarea>

      <label data-i18n="form.objectives"></label>
      <textarea id="objectives"
        data-placeholder="form.objectives.placeholder"
        placeholder=""></textarea>

      <label data-i18n="form.constraints"></label>
      <textarea id="constraints"
        data-placeholder="form.constraints.placeholder"
        placeholder=""></textarea>

      <!-- SECTION 3 -->
      <h3 class="form-section-title" data-i18n="form.section3"></h3>

      <label data-i18n="form.resources"></label>
      <textarea id="resources"
        data-placeholder="form.resources.placeholder"
        placeholder=""></textarea>

      <label data-i18n="form.kpi"></label>
      <textarea id="kpis"
        data-placeholder="form.kpi.placeholder"
        placeholder=""></textarea>

      <!-- SECTION 4 -->
      <h3 class="form-section-title" data-i18n="form.section4"></h3>

      <label data-i18n="form.delivery"></label>
      <select id="delivery">
        <option value="" data-i18n="form.select"></option>
        <option data-i18n="delivery.email"></option>
        <option data-i18n="delivery.whatsapp"></option>
        <option data-i18n="delivery.pdf"></option>
        <option data-i18n="delivery.display"></option>
      </select>

      <label data-i18n="form.email"></label>
      <input type="email" id="email"
        data-placeholder="form.email.placeholder"
        placeholder="" />

      <label data-i18n="form.whatsapp"></label>
      <input type="tel" id="whatsapp"
        data-placeholder="form.whatsapp.placeholder"
        placeholder="" />

      <button id="submit-btn" type="submit" class="btn-primary" data-i18n="form.submit"></button>

    </form>
  </section>

  <!-- ======================================== -->
  <!--                FOOTER                    -->
  <!-- ======================================== -->
  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer.rights"></p>
    </div>
  </footer>


  <!-- SCRIPTS -->
  <script src="translate.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const lang = localStorage.getItem("lang") || "fr";
      document.getElementById("languageSwitcher").value = lang;
      setLanguage(lang);
    });
  </script>

</body>
</html>
