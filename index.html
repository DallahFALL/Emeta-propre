<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="meta.title">e-META — Assistant IA</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" id="rtlStylesheet" disabled />
</head>

<body id="top">

<!-- =========================
     HEADER
========================== -->
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="#top">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
      <span class="logo-tagline" data-i18n="header.tagline"></span>
    </a>

    <button class="burger" id="burgerBtn" type="button" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="mainNav">
      <a href="#top" data-i18n="nav.home"></a>
      <a href="#form" data-i18n="nav.form"></a>
      <a href="privacy.html" data-i18n="nav.privacy"></a>
    </nav>

    <div class="header-actions">
      <select class="lang-select" id="langSelect">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ar">AR</option>
      </select>

      <button class="cta-custom" type="button" id="customBtn" data-i18n="cta.custom"></button>
    </div>
  </div>
</header>

<main>

<!-- =========================
     HERO
========================== -->
<section class="hero" id="hero">
  <div class="container hero-grid">

    <div class="hero-box">
      <h1 data-i18n="hero.title"></h1>
      <p class="hero-subtitle" data-i18n="header.tagline"></p>
      <p class="hero-subtitle" data-i18n="hero.subtitle"></p>

      <ul class="hero-points">
        <li data-i18n="hero.point1"></li>
        <li data-i18n="hero.point2"></li>
        <li data-i18n="hero.point3"></li>
      </ul>

      <button class="cta-primary" type="button" id="startBtn" data-i18n="hero.cta"></button>
    </div>

    <div class="hero-box muted">
      <div class="hero-badge">
        <span class="badge-title" data-i18n="hero.badge.title"></span>
        <span class="badge-text" data-i18n="hero.badge.text"></span>
      </div>
      <p class="hero-note" data-i18n="hero.note"></p>
    </div>

  </div>
</section>

<!-- =========================
     FORM SECTION
========================== -->
<section id="form">
  <div class="container">

    <header class="form-header">
      <h2 class="section-title" data-i18n="form.title"></h2>
      <div class="form-badge">🧠 <span data-i18n="form.badge.cabinet"></span></div>
      <p class="form-intro" data-i18n="form.intro"></p>
    </header>

    <!-- INDICATEUR D'ÉTAPES -->
    <nav class="form-steps">
      <span data-i18n="group.general"></span>
      <span data-i18n="group.analysis"></span>
      <span data-i18n="group.budget"></span>
      <span data-i18n="group.output"></span>
    </nav>

    <!-- =========================
         FORMULAIRE UNIQUE
    ========================== -->
    <form id="emetaForm" class="emeta-form" novalidate>

      <!-- ANALYSE -->
      <fieldset class="field-group">
        <legend data-i18n="group.analysis"></legend>

        <div class="field">
          <label for="problem" data-i18n="field.problem.label"></label>
          <textarea id="problem" name="problem" rows="4" data-i18n-placeholder="field.problem.ph"></textarea>
          <div class="hint subtle" data-i18n="help.problem"></div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="objectives" data-i18n="field.objectives.label"></label>
            <textarea id="objectives" name="objectives" rows="4" data-i18n-placeholder="field.objectives.ph"></textarea>
          </div>
          <div class="field">
            <label for="constraints" data-i18n="field.constraints.label"></label>
            <textarea id="constraints" name="constraints" rows="4" data-i18n-placeholder="field.constraints.ph"></textarea>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="kpis" data-i18n="field.kpis.label"></label>
            <textarea id="kpis" name="kpis" rows="4" data-i18n-placeholder="field.kpis.ph"></textarea>
          </div>
          <div class="field">
            <label for="resources" data-i18n="field.resources.label"></label>
            <textarea id="resources" name="resources" rows="4" data-i18n-placeholder="field.resources.ph"></textarea>
          </div>
        </div>

        <div class="field">
          <label for="context" data-i18n="field.context.label"></label>
          <textarea id="context" name="context" rows="5" data-i18n-placeholder="field.context.ph"></textarea>
        </div>
      </fieldset>

      <!-- BUDGET -->
      <fieldset class="field-group">
        <legend data-i18n="group.budget"></legend>

        <div class="grid-2">
          <div class="field">
            <label for="budgetMin" data-i18n="field.budgetMin.label"></label>
            <div class="field-with-unit">
              <input id="budgetMin" name="budgetMin" type="number" min="0" />
              <select id="currency" name="currency">
                <option value="XOF">XOF</option>
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="GBP">GBP</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="budgetMax" data-i18n="field.budgetMax.label"></label>
            <input id="budgetMax" name="budgetMax" type="number" min="0" />
          </div>
        </div>
      </fieldset>

      <!-- SORTIE -->
      <fieldset class="field-group">
        <legend data-i18n="group.output"></legend>

        <div class="checkbox-grid">
          <label class="check-item"><input type="checkbox" name="out_email" /><span data-i18n="field.outputMode.email"></span></label>
          <label class="check-item"><input type="checkbox" name="out_whatsapp" /><span data-i18n="field.outputMode.whatsapp"></span></label>
          <label class="check-item"><input type="checkbox" name="out_pdf" /><span data-i18n="field.outputMode.pdf"></span></label>
          <label class="check-item"><input type="checkbox" name="out_display" /><span data-i18n="field.outputMode.display"></span></label>
        </div>
      </fieldset>

      <!-- CONSENTEMENT -->
      <fieldset class="field-group">
        <legend data-i18n="group.trust"></legend>
        <label class="check-item">
          <input type="checkbox" id="consent" name="consent" required />
          <span data-i18n="field.consent.label"></span>
        </label>
      </fieldset>

      <!-- RÉSUMÉ -->
      <div id="summaryBox" class="summary-box" hidden>
        <h3 class="summary-title" data-i18n="summary.title"></h3>

        <div class="summary-score">
          <div class="score-bar"><span id="scoreFill"></span></div>
          <p class="score-text" id="scoreText"></p>
        </div>

        <div class="summary-content" id="summaryContent"></div>

        <div class="summary-actions">
          <button type="button" class="btn-secondary" id="editSummaryBtn"></button>
          <button type="button" class="btn-submit" id="confirmSummaryBtn"></button>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="form-actions">
        <button type="submit" class="btn-submit" data-i18n="form.submit" disabled></button>
        <button type="reset" class="btn-secondary" data-i18n="form.reset"></button>
      </div>

      <input type="hidden" id="metaSummaryInput" name="meta_summary" />
    </form>

  </div>
</section>

<!-- HELP ICONS -->
<div class="help-icons">
  <a id="pdfPrivacyLink" class="help-icon help-privacy" href="privacy.html" target="_blank"></a>
  <a id="pdfGuideLink" class="help-icon help-guide" target="_blank"></a>
</div>

</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p data-i18n="footer.text"></p>
    <a href="privacy.html" data-i18n="footer.privacy"></a>
    <p data-i18n="footer.copy"></p>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
