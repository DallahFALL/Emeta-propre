<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-META — Assistant IA de prise de décision</title>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" />
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="site-header">
  <div class="container header-inner">

    <div class="logo">
      <span class="logo-mark">e</span>
      <span class="logo-text">META</span>
    </div>

    <nav class="main-nav">
      <a href="#" data-i18n="nav.home"></a>
      <a href="#form" data-i18n="nav.form"></a>
      <a href="privacy.html" data-i18n="nav.privacy"></a>
    </nav>

    <div class="header-actions">
      <select id="langSelect" aria-label="Language selector">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ar">AR</option>
      </select>

      <button
        class="cta-btn"
        data-scroll-to="form"
        data-i18n="nav.cta">
      </button>
    </div>

  </div>
</header>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="container hero-inner">
    <h1 data-i18n="hero.title"></h1>
    <p data-i18n="hero.subtitle"></p>

    <button
      class="cta-main"
      data-scroll-to="form"
      data-i18n="hero.start">
    </button>
  </div>
</section>

<!-- ================= FORM ================= -->
<section class="form-section" id="form">
  <div class="container">

    <h2 data-i18n="form.title"></h2>

    <form class="form-card">

      <!-- ===== Section 1 ===== -->
      <fieldset class="field-group">
        <legend data-i18n="form.section1"></legend>

        <div class="field">
          <label data-i18n="form.country.label"></label>
          <input
            type="text"
            data-i18n-placeholder="form.country.placeholder"
          />
        </div>

        <div class="field">
          <label data-i18n="form.sector.label"></label>
          <input
            type="text"
            data-i18n-placeholder="form.sector.placeholder"
          />
        </div>

        <div class="field">
          <label data-i18n="form.org.label"></label>
          <textarea
            rows="3"
            data-i18n-placeholder="form.org.placeholder">
          </textarea>
        </div>
      </fieldset>

      <!-- ===== Section 2 ===== -->
      <fieldset class="field-group">
        <legend data-i18n="form.section2"></legend>

        <div class="field">
          <label data-i18n="form.problem.label"></label>
          <textarea
            rows="3"
            data-i18n-placeholder="form.problem.placeholder">
          </textarea>
        </div>

        <div class="field">
          <label data-i18n="form.objectives.label"></label>
          <textarea
            rows="3"
            data-i18n-placeholder="form.objectives.placeholder">
          </textarea>
        </div>
      </fieldset>

      <!-- ===== Section 3 ===== -->
      <fieldset class="field-group">
        <legend data-i18n="form.section3"></legend>

        <div class="field">
          <label data-i18n="form.constraints.label"></label>
          <textarea
            rows="3"
            data-i18n-placeholder="form.constraints.placeholder">
          </textarea>
        </div>

        <div class="field">
          <label data-i18n="form.resources.label"></label>
          <textarea
            rows="3"
            data-i18n-placeholder="form.resources.placeholder">
          </textarea>
        </div>
      </fieldset>

      <!-- ===== Section 4 ===== -->
      <fieldset class="field-group">
        <legend data-i18n="form.section4"></legend>

        <div class="field">
          <label data-i18n="form.expectations.label"></label>
          <textarea
            rows="3"
            data-i18n-placeholder="form.expectations.placeholder">
          </textarea>
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="submit" class="submit-btn" data-i18n="form.submit"></button>
      </div>

    </form>

  </div>
</section>

<!-- ================= FOOTER ================= -->
<footer class="site-footer">
  <div class="container">
    <p>© e-META 2025 — Assistant IA stratégique</p>
  </div>
</footer>

<!-- ================= SCRIPTS ================= -->
<script src="i18n.js"></script>
<script src="script.js"></script>

</body>
</html>
