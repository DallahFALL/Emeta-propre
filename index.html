<main>
    <section id="hero" class="hero-premium">
        <div class="container hero-content">
            <h1 class="hero-title" data-i18n="hero.title">...</h1>
            <p class="hero-subtitle" data-i18n="hero.subtitle">...</p>
        </div>
    </section>

    <section id="form" class="engine-section">
        <div class="container">
            <div class="decision-card">
                <div class="card-header">
                    <h2 data-i18n="form.title">Expertise Decision Engine</h2>
                    <div class="engine-status"><span class="status-dot"></span> <span data-i18n="engine.status">SYSTÈME PRÊT</span></div>
                </div>

                <form id="emetaMasterForm">
                    <!-- SECTION 01 -->
                    <div class="form-step">
                        <h3 class="step-title"><span data-i18n="group.general">01 Périmètre & Expertise</span></h3>
                        <div class="input-grid">
                            <div class="input-group">
                                <label data-i18n="field.projectTitle.label">Titre de la Décision</label>
                                <input type="text" name="projectTitle" data-i18n-placeholder="field.projectTitle.placeholder">
                            </div>
                            <div class="input-group">
                                <label data-i18n="field.domain.label">Expertise Requise</label>
                                <select name="domain">
                                    <option value="ai" data-i18n="domain.ai">Souveraineté IA</option>
                                    <option value="esg" data-i18n="domain.finance">Ingénierie ESG</option>
                                    <option value="ma" data-i18n="domain.ma">M&A</option>
                                    <option value="legal" data-i18n="domain.legal">Optimisation OHADA</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-grid">
                            <div class="input-group">
                                <label data-i18n="field.industry.label">Secteur d'Activité</label>
                                <select name="industry">
                                    <option value="energy" data-i18n="industry.energy">Énergies Vertes</option>
                                    <option value="blue" data-i18n="industry.blue">Blue Economy</option>
                                    <option value="health" data-i18n="industry.health">HealthTech</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label data-i18n="field.geography.label">Zone d'Impact</label>
                                <input type="text" name="geography" data-i18n-placeholder="field.geography.placeholder">
                            </div>
                        </div>
                    </div>

                    <!-- SECTION 02 -->
                    <div class="form-step">
                        <h3 class="step-title"><span data-i18n="group.analysis">02 Analyse de Contexte</span></h3>
                        <div class="input-group">
                            <label data-i18n="field.problem.label">Problématique & Enjeux</label>
                            <textarea name="problem" rows="4" data-i18n-placeholder="field.problem.placeholder"></textarea>
                        </div>
                        <div class="input-group">
                            <label data-i18n="field.fileLink.label">Audit Documentaire</label>
                            <input type="url" name="fileLink" data-i18n-placeholder="field.fileLink.placeholder">
                        </div>
                    </div>

                    <!-- SECTION 03 -->
                    <div class="form-step">
                        <h3 class="step-title"><span data-i18n="group.output">03 Canaux de Restitution</span></h3>
                        <div class="input-grid">
                            <div class="input-group">
                                <label data-i18n="field.email.label">Email</label>
                                <input type="email" name="email" placeholder="admin@votre-sasu.com">
                            </div>
                            <div class="input-group">
                                <label data-i18n="field.whatsapp.label">WhatsApp</label>
                                <input type="tel" name="whatsapp" placeholder="+221...">
                            </div>
                        </div>
                        <div class="delivery-container">
                            <label class="delivery-label" data-i18n="field.outputMode.label">Mode de livraison</label>
                            <div class="delivery-grid">
                                <label class="deliv-card"><input type="checkbox" name="wa" checked> <span>WhatsApp</span></label>
                                <label class="deliv-card"><input type="checkbox" name="mail" checked> <span>Email & PDF</span></label>
                                <label class="deliv-card"><input type="checkbox" name="web"> <span data-i18n="field.outputMode.display">Affichage Direct</span></label>
                            </div>
                        </div>
                    </div>

                    <div class="form-footer">
                        <p class="security-note"><span data-i18n="hero.trust">🔒 Souveraineté & Certification Blockchain</span></p>
                        <button type="submit" class="btn-engine" id="submitBtn">
                            <span data-i18n="form.submit">GÉNÉRER L'EXPERTISE</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>
